<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5E8" />
      <stop offset="30%" stop-color="#E5C158" />
      <stop offset="65%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#996D08" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262626" />
      <stop offset="100%" stop-color="#0F0F0F" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#D4AF37" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Base with Gold Border -->
  <rect x="20" y="20" width="472" height="472" rx="128" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="14" />
  
  <!-- Subtle Inner Border -->
  <rect x="42" y="42" width="428" height="428" rx="108" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="8 6" />

  <!-- Top Crown Accent -->
  <path d="M256 85 L268 103 L256 120 L244 103 Z" fill="url(#goldGrad)" />
  <circle cx="256" cy="68" r="4" fill="url(#goldGrad)" />

  <!-- Monogram LF in Luxury Serif Typography -->
  <g filter="url(#goldGlow)">
    <text x="180" y="325" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', Georgia, serif" font-size="220" font-weight="700" fill="url(#goldGrad)" text-anchor="middle">L</text>
    <text x="330" y="325" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', Georgia, serif" font-size="220" font-weight="700" fill="url(#goldGrad)" text-anchor="middle">F</text>
  </g>

  <!-- Bottom Delicate Swag Curve -->
  <path d="M160 385 Q256 368 352 385" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" fill="none" />
  <circle cx="256" cy="376" r="4" fill="url(#goldGrad)" />
</svg>
